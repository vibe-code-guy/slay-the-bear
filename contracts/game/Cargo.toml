[package]
name = "slay-game"
description = "Slay the Bear: a memecoin and a town game. Burn $SLAY to hit the Bear; drand decides the drops."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/vibe-code-guy/slay-the-bear"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.92.0"
image_digest = ""
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
